name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      # Set up Python for PyInstaller
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          pip install pyinstaller requests
        shell: pwsh

      - name: Install Inno Setup
        run: choco install -y innosetup
        shell: pwsh

      # Extract version from tag
      - name: Extract version
        id: vars
        run: |
          $ver = $env:GITHUB_REF -replace 'refs/tags/v',''
          echo "ver=$ver" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # Patch __version__ constant inside the source
      - name: Patch version in code
        run: |
          $ver = '${{ steps.vars.outputs.ver }}'
          (Get-Content results_gui_dynamic.py) -replace '__version__ = ".+"', "__version__ = `"$ver`"" | Set-Content results_gui_dynamic.py
        shell: pwsh

      # Build portable EXE (no console)
      - name: PyInstaller build
        run: pyinstaller ChemResultsGUI.spec
        shell: pwsh



      # Build Windows installer via Inno Setup
      - name: Compile installer
        run: iscc /DMyAppVersion=${{ steps.vars.outputs.ver }} installer.iss
        shell: pwsh

      # Upload artefacts to the GitHub Release that triggered this workflow
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.PAT_TOKEN }}
          files: |
            dist/ChemResultsGUI_portable.exe
            Output/ChemResultsGUISetup_*.exe
